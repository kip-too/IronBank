spring:
  application:
    name: shilingi
  datasource:
    url: jdbc:postgresql://localhost:5432/shilingi
    username: postgres
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration

shilingi:
  clock:
    # The zone business dates are decided in. This value is a DECISION, not a default:
    # it determines which calendar day - and so which month - a posting belongs to.
    # SPEC.md does not state it. Recorded here so it is reviewable, and flagged to Kurgat
    # for ratification. There is no fallback in Java; a missing value stops startup.
    zone: Africa/Nairobi

  # SPEC.md O6: planning horizon and buffer. Stated in SPEC.md section 11 as defaults, and
  # recorded here rather than hardcoded so they are reviewable and changeable without a rebuild.
  # There is no fallback in Java: a missing value stops startup, the same as the clock zone,
  # because a buffer nobody chose is a financial rule nobody chose.
  agent:
    horizon-days: 35
    buffer: "0.10"

  settlement:
    # The Node sidecar (SPEC.md section 12). It listens on loopback only - that is the whole of
    # its security model, and it is stated rather than implied. Start it with:
    #     cd sidecar && npm run stub      (no network needed)
    #     cd sidecar && npm start         (live, needs an unblocked network - docs/network.md s4)
    base-url: "http://127.0.0.1:8787"
    # A timeout here means the outcome is UNKNOWN, never that the payment failed.
    timeout-seconds: 10
